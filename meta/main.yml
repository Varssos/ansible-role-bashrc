---
galaxy_info:
  author: Varssos
  description: Stow personal bashrc from the dotfiles repository on Debian/Ubuntu systems
  license: MIT
  min_ansible_version: "2.9"

  platforms:
    - name: Ubuntu
      versions:
        - focal
        - jammy
        - noble
    - name: Debian
      versions:
        - bullseye
        - bookworm
    - name: Linux Mint
      versions:
        - "21"
        - "22"

  galaxy_tags:
    - bashrc
    - shell
    - cli

dependencies:
  - role: dotfiles
